<header class="hud-panel header-hud">
  <div class="brand-block">
    <img class="brand-mark-image" src="assets/brand/pixel-evolution-arena-mark.svg" alt="" />
    <div class="brand-copy">
      <h1>Pixel Evolution Arena</h1>
      <p>Collect. Build. Battle. Evolve.</p>
    </div>
  </div>

  <div class="hud-stats" aria-label="Player resources">
    <div class="stat-chip coins" [class.stat-pulse]="pulseFor('coins')()">
      <span class="stat-icon">CR</span><span class="stat-body"><span class="stat-label">Coins</span><strong [appCountUp]="game.player().coins"></strong></span>
    </div>
    <div class="stat-chip dna" [class.stat-pulse]="pulseFor('dna')()">
      <span class="stat-icon">DN</span><span class="stat-body"><span class="stat-label">DNA</span><strong [appCountUp]="game.player().dnaShards"></strong></span>
    </div>
    <div class="stat-chip power secondary-stat" [class.stat-pulse]="pulseFor('power')()">
      <span class="stat-icon">PW</span><span class="stat-body"><span class="stat-label">Team Power</span><strong [appCountUp]="game.teamPower()"></strong></span>
    </div>
    <div class="stat-chip dex secondary-stat" [class.stat-pulse]="pulseFor('dex')()">
      <span class="stat-icon">DX</span><span class="stat-body"><span class="stat-label">Dex</span><strong>{{ unlockedCount() }}/{{ totalCount() }}</strong></span>
      <i aria-hidden="true"><b [style.width.%]="dexPercent()"></b></i>
    </div>
    <div class="utility-wrap">
      <button type="button" class="utility-button" aria-label="Open utility menu" [attr.aria-expanded]="utilityOpen()" (click)="utilityOpen.set(!utilityOpen())">•••</button>
      @if (utilityOpen()) {
        <div class="utility-menu">
          <span>{{ game.saveStatusLabel() }} · {{ game.lastSavedLabel() }}</span>
          <button type="button" (click)="openSettings()">Settings</button>
        </div>
      }
    </div>
  </div>
</header>
