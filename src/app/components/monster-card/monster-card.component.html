<button
  class="monster-card stage-{{ stageClass }}"
  [class.selected]="selected"
  [class.locked]="!monster.unlocked"
  [class.compact]="compact"
  type="button"
  (click)="selectMonster.emit(monster.id)"
>
  <span class="monster-id">{{ monster.id }}</span>
  <span class="monster-icon" aria-hidden="true">{{ monster.unlocked ? monster.icon : '▧' }}</span>
  <strong>{{ monster.unlocked ? monster.name : 'Locked' }}</strong>
  <span class="monster-meta">{{ monster.stage }} · {{ monster.type }}</span>
  <span class="monster-meta">Lv. {{ monster.level }} · {{ monster.rarity }}</span>
  <span class="mini-stats">
    <span>ATK {{ monster.attack }}</span>
    <span>DEF {{ monster.defense }}</span>
    <span>SPD {{ monster.speed }}</span>
  </span>
  <span class="power-line">Power {{ power }}</span>
  @if (!monster.unlocked) {
    <span class="lock-mark">🔒</span>
  }
</button>
