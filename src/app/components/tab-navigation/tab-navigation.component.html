<nav class="primary-nav" aria-label="Game sections">
  @for (tab of tabs; track tab.label) {
    <button
      type="button"
      class="primary-nav-item"
      [class.active]="activeSection === tab.label"
      [attr.aria-current]="activeSection === tab.label ? 'page' : null"
      (click)="sectionChange.emit(tab.label)"
    >
      <span class="primary-nav-icon" aria-hidden="true">{{ tab.icon }}</span>
      <span>{{ tab.label }}</span>
    </button>
  }
</nav>
