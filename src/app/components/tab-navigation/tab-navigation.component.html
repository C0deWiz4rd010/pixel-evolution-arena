<nav class="tab-nav blueprint-nav" aria-label="Game sections">
  <div class="tab-cluster" aria-label="Primary game sections">
    @for (tab of tabs; track tab.label) {
      <button
        class="tab-button"
        [class.active]="activeTab === tab.label"
        type="button"
        (click)="tabChange.emit(tab.label)"
      >
        <span class="tab-icon">{{ tab.icon }}</span>
        <span class="tab-copy">
          <span class="tab-label">{{ tab.label }}</span>
          <span class="tab-status">{{ tab.signal }}</span>
        </span>
      </button>
    }
  </div>

  <div class="link-legend" aria-label="Evolution link legend">
    <span class="legend-title">
      <span class="legend-kicker">Route Legend</span>
      <strong>Data Links</strong>
    </span>
    <span class="legend-keys">
      @for (link of linkTypes; track link.label) {
        <span class="link-key {{ link.className }}">
          <i></i>
          <span class="link-copy">
            <strong>{{ link.label }}</strong>
            <small>{{ link.hint }}</small>
          </span>
        </span>
      }
    </span>
  </div>

  <button
    class="tab-button handbook-tab"
    [class.active]="activeTab === handbookTab.label"
    type="button"
    (click)="tabChange.emit(handbookTab.label)"
  >
    <span class="tab-icon">{{ handbookTab.icon }}</span>
    <span class="tab-copy">
      <span class="tab-label">{{ handbookTab.label }}</span>
      <span class="tab-status">{{ handbookTab.signal }}</span>
    </span>
  </button>
</nav>
