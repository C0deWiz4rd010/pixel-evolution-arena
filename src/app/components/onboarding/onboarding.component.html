@if (visible()) {
  <div class="onboarding-scrim" role="dialog" aria-modal="true" aria-label="Getting started">
    <div class="onboarding-card">
      <div class="step-dots" aria-hidden="true">
        @for (step of steps; track $index) {
          <span class="dot" [class.active]="$index === index()" [class.done]="$index < index()"></span>
        }
      </div>
      <span class="step-counter">Step {{ index() + 1 }} / {{ steps.length }}</span>
      <h2>{{ current().title }}</h2>
      <p>{{ current().body }}</p>
      <div class="onboarding-actions">
        <button type="button" class="ghost" (click)="skip()">Skip</button>
        <div class="nav-buttons">
          @if (index() > 0) {
            <button type="button" (click)="back()">Back</button>
          }
          <button type="button" class="primary" (click)="next()">
            {{ isLast() ? 'Start Playing' : 'Next' }}
          </button>
        </div>
      </div>
    </div>
  </div>
}
