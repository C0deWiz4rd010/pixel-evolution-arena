    <g class="eyes"><rect x="52.2" y="86" width="7" height="8" rx="1" fill="#070310"/><rect x="68.8" y="86" width="7" height="8" rx="1" fill="#070310"/><rect x="54.2" y="88" width="3" height="4" fill="#d95dff" class="glow"/><rect x="70.8" y="88" width="3" height="4" fill="#d95dff" class="glow"/></g>
    <polygon points="59,97 69,97 67,101 61,101" fill="#070310" opacity="0.85"/>
