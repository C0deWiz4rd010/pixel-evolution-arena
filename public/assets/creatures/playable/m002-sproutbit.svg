<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" shape-rendering="crispEdges" role="img" aria-labelledby="title desc" data-creature-id="M002" data-stage="Baby" data-type="Nature">
  <title id="title">Sproutbit sprite</title>
  <desc id="desc">Original Baby Nature pixel creature for Pixel Evolution Arena.</desc>
  <style><![CDATA[
    * { shape-rendering: crispEdges; }
    .idle { transform-box: fill-box; transform-origin: center bottom; animation: bob 2.80s steps(2, end) infinite; }
    .eyes { transform-box: fill-box; transform-origin: center; animation: blink 3.8s steps(1, end) infinite; }
    .glow { animation: glow 2.2s steps(2, end) infinite; }
    .scan { transform-box: fill-box; animation: scan 3.1s linear infinite; }
    .wing { transform-box: fill-box; transform-origin: center; animation: flap 1.6s ease-in-out infinite; }
    .wr { transform-origin: left center; }
    .wl { transform-origin: right center; }
    .flame { transform-box: fill-box; transform-origin: center bottom; animation: flick 0.5s steps(2, end) infinite; }
    .ember { animation: glow 0.9s steps(2, end) infinite; }
    .halo { animation: glow 2.6s ease-in-out infinite; }
    .drip { transform-box: fill-box; animation: drip 2.4s ease-in infinite; }
    .bob-leaf { transform-box: fill-box; transform-origin: center bottom; animation: sway 3.4s ease-in-out infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes blink { 0%, 46%, 54%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.12); } }
    @keyframes glow { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    @keyframes scan { 0% { transform: translateY(0); opacity: 0.05; } 50% { opacity: 0.35; } 100% { transform: translateY(14px); opacity: 0.05; } }
    @keyframes flap { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(0.7); } }
    @keyframes flick { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.18) translateY(-2px); } }
    @keyframes drip { 0%, 60% { transform: translateY(0); opacity: 0.9; } 90% { transform: translateY(6px); opacity: 0; } 100% { opacity: 0; } }
    @keyframes sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
    @media (prefers-reduced-motion: reduce) { .idle, .eyes, .glow, .scan, .wing, .flame, .ember, .halo, .drip, .bob-leaf { animation: none; } }
  ]]></style>
  <rect width="128" height="128" fill="none"/>
  <g class="idle" stroke="#06180f" stroke-width="0">
    
    <rect x="46.5" y="114" width="35" height="6" rx="3" fill="#000000" opacity="0.24"/>
    <polygon points="52.5,90 75.5,90 79.5,94 79.5,104 75.5,108 52.5,108 48.5,104 48.5,94" fill="#13693a"/>
    <polygon points="54.5,93 73.5,93 76.5,96 76.5,102 73.5,105 54.5,105 51.5,102 51.5,96" fill="#39c66f"/>
    <rect x="56" y="96" width="11.25" height="2.64" rx="2" fill="#c4ff8f" opacity="0.7"/>
    <polygon class="bob-leaf" points="62,93 48,85 60,81" fill="#c4ff8f"/>
    <polygon class="bob-leaf" points="66,93 80,85 68,81" fill="#b7ff5f"/>
    <rect x="63" y="81" width="3" height="14" fill="#13693a"/>
    <g class="eyes"><rect x="58" y="91" width="12" height="9" rx="2" fill="#06180f"/><rect x="61" y="94" width="6" height="5" fill="#b7ff5f" class="glow"/></g>
    <rect x="61" y="103" width="6" height="2" rx="1" fill="#06180f" opacity="0.8"/>
    <rect x="57.5" y="99" width="4" height="8" rx="1" fill="#b7ff5f" class="glow" opacity="0.8"/>
    <rect x="67.5" y="103" width="4" height="8" rx="1" fill="#b7ff5f" class="glow" opacity="0.8"/>
    <rect class="scan" x="50.5" y="90" width="27" height="3" fill="#eaffd0" opacity="0.2"/>
  </g>
</svg>
