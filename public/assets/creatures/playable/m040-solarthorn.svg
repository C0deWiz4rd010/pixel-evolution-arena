    <polygon points="52,37 56,27 60,37 64,25 68,37 72,27 76,37" fill="#eaffd0" class="glow" opacity="0.9"/>
    <g class="eyes"><rect x="51.76" y="51" width="24.48" height="6" rx="2" fill="#06180f"/><rect x="53.2" y="52" width="21.6" height="3" fill="#b7ff5f" class="glow"/></g>
    <polygon points="59,61 69,61 67,65 61,65" fill="#06180f" opacity="0.85"/>
