<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" shape-rendering="crispEdges" role="img" aria-labelledby="title desc" data-creature-id="M013" data-stage="In-Training" data-type="Toxic">
  <title id="title">Oozelet sprite</title>
  <desc id="desc">Original In-Training Toxic pixel creature for Pixel Evolution Arena.</desc>
  <style><![CDATA[
    * { shape-rendering: crispEdges; }
    .idle { transform-box: fill-box; transform-origin: center bottom; animation: bob 2.68s steps(2, end) infinite; }
    .eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.4s steps(1, end) infinite; }
    .glow { animation: glow 2.2s steps(2, end) infinite; }
    .scan { transform-box: fill-box; animation: scan 3.1s linear infinite; }
    .wing { transform-box: fill-box; transform-origin: center; animation: flap 1.6s ease-in-out infinite; }
    .wr { transform-origin: left center; }
    .wl { transform-origin: right center; }
    .flame { transform-box: fill-box; transform-origin: center bottom; animation: flick 0.5s steps(2, end) infinite; }
    .ember { animation: glow 0.9s steps(2, end) infinite; }
    .halo { animation: glow 2.6s ease-in-out infinite; }
    .drip { transform-box: fill-box; animation: drip 2.4s ease-in infinite; }
    .bob-leaf { transform-box: fill-box; transform-origin: center bottom; animation: sway 3.4s ease-in-out infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes blink { 0%, 46%, 54%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.12); } }
    @keyframes glow { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    @keyframes scan { 0% { transform: translateY(0); opacity: 0.05; } 50% { opacity: 0.35; } 100% { transform: translateY(22px); opacity: 0.05; } }
    @keyframes flap { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(0.7); } }
    @keyframes flick { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.18) translateY(-2px); } }
    @keyframes drip { 0%, 60% { transform: translateY(0); opacity: 0.9; } 90% { transform: translateY(6px); opacity: 0; } 100% { opacity: 0; } }
    @keyframes sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
    @media (prefers-reduced-motion: reduce) { .idle, .eyes, .glow, .scan, .wing, .flame, .ember, .halo, .drip, .bob-leaf { animation: none; } }
  ]]></style>
  <rect width="128" height="128" fill="none"/>
  <g class="idle" stroke="#0c1a05" stroke-width="0">
    
    <rect x="45.5" y="114" width="37" height="6" rx="3" fill="#000000" opacity="0.24"/>
    <polygon points="52.5,82 75.5,82 80.5,87 80.5,103 75.5,108 52.5,108 47.5,103 47.5,87" fill="#3a2266"/>
    <polygon points="54.5,85 73.5,85 77.5,89 77.5,101 73.5,105 54.5,105 50.5,101 50.5,89" fill="#9ad42a"/>
    <rect x="55.36" y="88" width="12.15" height="4.4" rx="2" fill="#dcff7a" opacity="0.7"/>
    <polygon points="55,67 73,67 77,71 77,85 73,89 55,89 51,85 51,71" fill="#3a2266"/>
    <polygon points="56.5,69 71.5,69 74.5,72 74.5,83 71.5,86 56.5,86 53.5,83 53.5,72" fill="#9ad42a"/>
    <polygon points="54,67 58,56 62,67" fill="#c084fc"/>
    <polygon points="66,67 70,54 74,67" fill="#c084fc"/>
    <rect x="71" y="84" width="4" height="6" rx="2" fill="#c084fc" class="drip"/>
    <g class="eyes"><rect x="54" y="74" width="7" height="8" rx="1" fill="#0c1a05"/><rect x="67" y="74" width="7" height="8" rx="1" fill="#0c1a05"/><rect x="56" y="76" width="3" height="4" fill="#c084fc" class="glow"/><rect x="69" y="76" width="3" height="4" fill="#c084fc" class="glow"/></g>
    <rect x="61" y="85" width="6" height="2" rx="1" fill="#0c1a05" opacity="0.8"/>
    <rect x="62.5" y="95" width="4" height="8" rx="1" fill="#c084fc" class="glow" opacity="0.8"/>
    <rect class="scan" x="49.5" y="82" width="29" height="3" fill="#f1ffcf" opacity="0.2"/>
  </g>
</svg>
