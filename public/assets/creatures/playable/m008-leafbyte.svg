<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" shape-rendering="crispEdges" role="img" aria-labelledby="title desc" data-creature-id="M008" data-stage="In-Training" data-type="Nature">
  <title id="title">Leafbyte sprite</title>
  <desc id="desc">Original In-Training Nature pixel creature for Pixel Evolution Arena.</desc>
  <style><![CDATA[
    * { shape-rendering: crispEdges; }
    .idle { transform-box: fill-box; transform-origin: center bottom; animation: bob 2.68s steps(2, end) infinite; }
    .eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.4s steps(1, end) infinite; }
    .glow { animation: glow 2.2s steps(2, end) infinite; }
    .scan { transform-box: fill-box; animation: scan 3.1s linear infinite; }
    .wing { transform-box: fill-box; transform-origin: center; animation: flap 1.6s ease-in-out infinite; }
    .wr { transform-origin: left center; }
    .wl { transform-origin: right center; }
    .flame { transform-box: fill-box; transform-origin: center bottom; animation: flick 0.5s steps(2, end) infinite; }
    .ember { animation: glow 0.9s steps(2, end) infinite; }
    .halo { animation: glow 2.6s ease-in-out infinite; }
    .drip { transform-box: fill-box; animation: drip 2.4s ease-in infinite; }
    .bob-leaf { transform-box: fill-box; transform-origin: center bottom; animation: sway 3.4s ease-in-out infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes blink { 0%, 46%, 54%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.12); } }
    @keyframes glow { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    @keyframes scan { 0% { transform: translateY(0); opacity: 0.05; } 50% { opacity: 0.35; } 100% { transform: translateY(22px); opacity: 0.05; } }
    @keyframes flap { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(0.7); } }
    @keyframes flick { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.18) translateY(-2px); } }
    @keyframes drip { 0%, 60% { transform: translateY(0); opacity: 0.9; } 90% { transform: translateY(6px); opacity: 0; } 100% { opacity: 0; } }
    @keyframes sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
    @media (prefers-reduced-motion: reduce) { .idle, .eyes, .glow, .scan, .wing, .flame, .ember, .halo, .drip, .bob-leaf { animation: none; } }
  ]]></style>
  <rect width="128" height="128" fill="none"/>
  <g class="idle" stroke="#06180f" stroke-width="0">
    
    <rect x="46.5" y="114" width="35" height="6" rx="3" fill="#000000" opacity="0.24"/>
    <polygon points="55.5,82 72.5,82 79.5,89 79.5,101 72.5,108 55.5,108 48.5,101 48.5,89" fill="#13693a"/>
    <polygon points="57.5,85 70.5,85 76.5,91 76.5,99 70.5,105 57.5,105 51.5,99 51.5,91" fill="#39c66f"/>
    <rect x="56" y="88" width="11.25" height="4.4" rx="2" fill="#c4ff8f" opacity="0.7"/>
    <polygon points="60,71 68,71 74,77 74,81 68,87 60,87 54,81 54,77" fill="#13693a"/>
    <polygon points="61.5,73 66.5,73 71.5,78 71.5,79 66.5,84 61.5,84 56.5,79 56.5,78" fill="#39c66f"/>
    <polygon class="bob-leaf" points="62,71 48,63 60,59" fill="#c4ff8f"/>
    <polygon class="bob-leaf" points="66,71 80,63 68,59" fill="#b7ff5f"/>
    <rect x="63" y="59" width="3" height="14" fill="#13693a"/>
    <g class="eyes"><rect x="54" y="75" width="7" height="8" rx="1" fill="#06180f"/><rect x="67" y="75" width="7" height="8" rx="1" fill="#06180f"/><rect x="56" y="77" width="3" height="4" fill="#b7ff5f" class="glow"/><rect x="69" y="77" width="3" height="4" fill="#b7ff5f" class="glow"/></g>
    <rect x="61" y="86" width="6" height="2" rx="1" fill="#06180f" opacity="0.8"/>
    <rect x="52.5" y="95" width="4" height="8" rx="1" fill="#b7ff5f" class="glow" opacity="0.8"/>
    <rect x="62.5" y="99" width="4" height="8" rx="1" fill="#b7ff5f" class="glow" opacity="0.8"/>
    <rect x="72.5" y="95" width="4" height="8" rx="1" fill="#b7ff5f" class="glow" opacity="0.8"/>
    <rect class="scan" x="50.5" y="82" width="27" height="3" fill="#eaffd0" opacity="0.2"/>
  </g>
</svg>
