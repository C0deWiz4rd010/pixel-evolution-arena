<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" shape-rendering="crispEdges" role="img" aria-labelledby="title desc" data-creature-id="M010" data-stage="In-Training" data-type="Dark">
  <title id="title">Nightnub sprite</title>
  <desc id="desc">Original In-Training Dark pixel creature for Pixel Evolution Arena.</desc>
  <style><![CDATA[
    * { shape-rendering: crispEdges; }
    .idle { transform-box: fill-box; transform-origin: center bottom; animation: bob 2.68s steps(2, end) infinite; }
    .eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.4s steps(1, end) infinite; }
    .glow { animation: glow 2.2s steps(2, end) infinite; }
    .scan { transform-box: fill-box; animation: scan 3.1s linear infinite; }
    .wing { transform-box: fill-box; transform-origin: center; animation: flap 1.6s ease-in-out infinite; }
    .wr { transform-origin: left center; }
    .wl { transform-origin: right center; }
    .flame { transform-box: fill-box; transform-origin: center bottom; animation: flick 0.5s steps(2, end) infinite; }
    .ember { animation: glow 0.9s steps(2, end) infinite; }
    .halo { animation: glow 2.6s ease-in-out infinite; }
    .drip { transform-box: fill-box; animation: drip 2.4s ease-in infinite; }
    .bob-leaf { transform-box: fill-box; transform-origin: center bottom; animation: sway 3.4s ease-in-out infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes blink { 0%, 46%, 54%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.12); } }
    @keyframes glow { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    @keyframes scan { 0% { transform: translateY(0); opacity: 0.05; } 50% { opacity: 0.35; } 100% { transform: translateY(18px); opacity: 0.05; } }
    @keyframes flap { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(0.7); } }
    @keyframes flick { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.18) translateY(-2px); } }
    @keyframes drip { 0%, 60% { transform: translateY(0); opacity: 0.9; } 90% { transform: translateY(6px); opacity: 0; } 100% { opacity: 0; } }
    @keyframes sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
    @media (prefers-reduced-motion: reduce) { .idle, .eyes, .glow, .scan, .wing, .flame, .ember, .halo, .drip, .bob-leaf { animation: none; } }
  ]]></style>
  <rect width="128" height="128" fill="none"/>
  <g class="idle" stroke="#070310" stroke-width="0">
    
    <rect x="44" y="114" width="40" height="6" rx="3" fill="#000000" opacity="0.24"/>
    <polygon points="53,86 75,86 82,93 82,101 75,108 53,108 46,101 46,93" fill="#241548"/>
    <polygon points="55,89 73,89 79,95 79,99 73,105 55,105 49,99 49,95" fill="#6f54f0"/>
    <rect x="54.4" y="92" width="13.5" height="3.52" rx="2" fill="#c79bff" opacity="0.7"/>
    <polygon points="55.5,70 72.5,70 78.5,76 78.5,87 72.5,93 55.5,93 49.5,87 49.5,76" fill="#241548"/>
    <polygon points="57,72 71,72 76,77 76,85 71,90 57,90 52,85 52,77" fill="#6f54f0"/>
    <polygon points="52.5,72 44.5,58 58.5,68" fill="#241548"/>
    <polygon points="75.5,72 83.5,58 69.5,68" fill="#241548"/>
    <rect x="45.5" y="58" width="3" height="3" fill="#d95dff" class="glow"/>
    <rect x="79.5" y="58" width="3" height="3" fill="#d95dff" class="glow"/>
    <g class="eyes"><rect x="54" y="77.5" width="7" height="8" rx="1" fill="#070310"/><rect x="67" y="77.5" width="7" height="8" rx="1" fill="#070310"/><rect x="56" y="79.5" width="3" height="4" fill="#d95dff" class="glow"/><rect x="69" y="79.5" width="3" height="4" fill="#d95dff" class="glow"/></g>
    <rect x="61" y="88.5" width="6" height="2" rx="1" fill="#070310" opacity="0.8"/>
    <rect x="57.5" y="97" width="4" height="8" rx="1" fill="#d95dff" class="glow" opacity="0.8"/>
    <rect x="67.5" y="101" width="4" height="8" rx="1" fill="#d95dff" class="glow" opacity="0.8"/>
    <rect class="scan" x="48" y="86" width="32" height="3" fill="#f0d8ff" opacity="0.2"/>
  </g>
</svg>
