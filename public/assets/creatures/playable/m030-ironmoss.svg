    <rect x="56.96" y="60" width="9.9" height="9.68" rx="2" fill="#d4ecf5" opacity="0.7"/>
    <polygon points="57.5,43 70.5,43 73.5,46 73.5,56 70.5,59 57.5,59 54.5,56 54.5,46" fill="#34505c"/>
    <polygon points="59,45 69,45 71,47 71,54 69,56 59,56 57,54 57,47" fill="#7fa6b6"/>
    <rect x="53" y="105" width="9" height="8" rx="2" fill="#34505c"/>
    <rect x="66" y="105" width="9" height="8" rx="2" fill="#34505c"/>
    <rect x="55" y="108" width="3" height="3" fill="#37e0ff" class="glow"/>
    <rect x="70" y="108" width="3" height="3" fill="#37e0ff" class="glow"/>
    <rect x="45" y="74" width="7" height="20" rx="2" fill="#34505c"/>
    <rect x="76" y="74" width="7" height="20" rx="2" fill="#34505c"/>
    <rect x="63" y="27" width="3" height="14" fill="#34505c"/>
    <rect x="61" y="23" width="7" height="7" rx="1" fill="#37e0ff" class="glow"/>
    <rect x="51.5" y="49" width="4" height="4" fill="#d4ecf5"/>
    <rect x="72.5" y="49" width="4" height="4" fill="#d4ecf5"/>
    <g class="eyes"><rect x="58" y="46" width="12" height="9" rx="2" fill="#091318"/><rect x="61" y="49" width="6" height="5" fill="#37e0ff" class="glow"/></g>
    <polygon points="59,58 69,58 67,62 61,62" fill="#091318" opacity="0.85"/>
    <rect x="62.5" y="79" width="4" height="8" rx="1" fill="#37e0ff" class="glow" opacity="0.8"/>
