<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" shape-rendering="crispEdges" role="img" aria-labelledby="title desc" data-creature-id="M007" data-stage="In-Training" data-type="Water">
  <title id="title">Aquabun sprite</title>
  <desc id="desc">Original In-Training Water pixel creature for Pixel Evolution Arena.</desc>
  <style><![CDATA[
    * { shape-rendering: crispEdges; }
    .idle { transform-box: fill-box; transform-origin: center bottom; animation: bob 2.68s steps(2, end) infinite; }
    .eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.4s steps(1, end) infinite; }
    .glow { animation: glow 2.2s steps(2, end) infinite; }
    .scan { transform-box: fill-box; animation: scan 3.1s linear infinite; }
    .wing { transform-box: fill-box; transform-origin: center; animation: flap 1.6s ease-in-out infinite; }
    .wr { transform-origin: left center; }
    .wl { transform-origin: right center; }
    .flame { transform-box: fill-box; transform-origin: center bottom; animation: flick 0.5s steps(2, end) infinite; }
    .ember { animation: glow 0.9s steps(2, end) infinite; }
    .halo { animation: glow 2.6s ease-in-out infinite; }
    .drip { transform-box: fill-box; animation: drip 2.4s ease-in infinite; }
    .bob-leaf { transform-box: fill-box; transform-origin: center bottom; animation: sway 3.4s ease-in-out infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes blink { 0%, 46%, 54%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.12); } }
    @keyframes glow { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    @keyframes scan { 0% { transform: translateY(0); opacity: 0.05; } 50% { opacity: 0.35; } 100% { transform: translateY(22px); opacity: 0.05; } }
    @keyframes flap { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(0.7); } }
    @keyframes flick { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.18) translateY(-2px); } }
    @keyframes drip { 0%, 60% { transform: translateY(0); opacity: 0.9; } 90% { transform: translateY(6px); opacity: 0; } 100% { opacity: 0; } }
    @keyframes sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
    @media (prefers-reduced-motion: reduce) { .idle, .eyes, .glow, .scan, .wing, .flame, .ember, .halo, .drip, .bob-leaf { animation: none; } }
  ]]></style>
  <rect width="128" height="128" fill="none"/>
  <g class="idle" stroke="#041826" stroke-width="0">
    
    <rect x="45.5" y="114" width="37" height="6" rx="3" fill="#000000" opacity="0.24"/>
    <polygon points="51.5,82 76.5,82 80.5,86 80.5,104 76.5,108 51.5,108 47.5,104 47.5,86" fill="#0d5278"/>
    <polygon points="53.5,85 74.5,85 77.5,88 77.5,102 74.5,105 53.5,105 50.5,102 50.5,88" fill="#21a3da"/>
    <rect x="55.36" y="88" width="12.15" height="4.4" rx="2" fill="#9aedff" opacity="0.7"/>
    <polygon points="56,70 72,70 75,73 75,85 72,88 56,88 53,85 53,73" fill="#0d5278"/>
    <polygon points="57.5,72 70.5,72 72.5,74 72.5,83 70.5,85 57.5,85 55.5,83 55.5,74" fill="#21a3da"/>
    <polygon points="56,70 64,56 72,70" fill="#0d5278"/>
    <polygon points="60,70 64,61 68,70" fill="#9aedff"/>
    <rect x="46" y="66" width="3" height="3" fill="#e3fbff" class="scan"/>
    <g class="eyes"><rect x="58" y="74" width="12" height="9" rx="2" fill="#041826"/><rect x="61" y="77" width="6" height="5" fill="#36d6ff" class="glow"/></g>
    <rect x="61" y="86" width="6" height="2" rx="1" fill="#041826" opacity="0.8"/>
    <rect x="57.5" y="95" width="4" height="8" rx="1" fill="#36d6ff" class="glow" opacity="0.8"/>
    <rect x="67.5" y="99" width="4" height="8" rx="1" fill="#36d6ff" class="glow" opacity="0.8"/>
    <rect class="scan" x="49.5" y="82" width="29" height="3" fill="#e3fbff" opacity="0.2"/>
  </g>
</svg>
