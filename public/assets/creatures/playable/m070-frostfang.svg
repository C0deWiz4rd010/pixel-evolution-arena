    <polygon points="60,52 64,43 68,52" fill="#9aedff"/>
    <rect x="46" y="48" width="3" height="3" fill="#e3fbff" class="scan"/>
    <g class="eyes"><rect x="58" y="61" width="12" height="9" rx="2" fill="#041826"/><rect x="61" y="64" width="6" height="5" fill="#36d6ff" class="glow"/></g>
    <polygon points="59,73 69,73 67,77 61,77" fill="#041826" opacity="0.85"/>
