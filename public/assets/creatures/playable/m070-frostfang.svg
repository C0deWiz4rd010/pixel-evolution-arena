    <polygon points="53.5,52 74.5,52 80.5,58 80.5,74 74.5,80 53.5,80 47.5,74 47.5,58" fill="#0d5278"/>
    <polygon points="55,54 73,54 78,59 78,72 73,77 55,77 50,72 50,59" fill="#21a3da"/>
    <rect x="45" y="105" width="9" height="8" rx="2" fill="#0d5278"/>
    <rect x="74" y="105" width="9" height="8" rx="2" fill="#0d5278"/>
