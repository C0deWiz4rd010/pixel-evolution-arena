    <polygon points="50,84 78,84 81,87 81,102 78,105 50,105 47,102 47,87" fill="#ffce3a"/>
    <rect x="53.12" y="87" width="15.3" height="4.62" rx="2" fill="#fff4bd" opacity="0.7"/>
    <polygon points="52.5,63 75.5,63 78.5,66 78.5,87 75.5,90 52.5,90 49.5,87 49.5,66" fill="#9a7a14"/>
    <polygon points="54,65 74,65 76,67 76,85 74,87 54,87 52,85 52,67" fill="#ffce3a"/>
    <rect x="47" y="105" width="9" height="8" rx="2" fill="#9a7a14"/>
    <rect x="72" y="105" width="9" height="8" rx="2" fill="#9a7a14"/>
    <rect x="49" y="108" width="3" height="3" fill="#ffe884" class="glow"/>
    <rect x="76" y="108" width="3" height="3" fill="#ffe884" class="glow"/>
    <ellipse class="glow halo" cx="64" cy="53" rx="12.18" ry="4" fill="none" stroke="#ffe884" stroke-width="3"/>
    <rect x="63" y="45" width="3" height="6" fill="#fffbe6" class="glow"/>
    <g class="eyes"><rect x="54" y="72.5" width="7" height="8" rx="1" fill="#2a2206"/><rect x="67" y="72.5" width="7" height="8" rx="1" fill="#2a2206"/><rect x="56" y="74.5" width="3" height="4" fill="#ffe884" class="glow"/><rect x="69" y="74.5" width="3" height="4" fill="#ffe884" class="glow"/></g>
    <polygon points="59,83.5 69,83.5 67,87.5 61,87.5" fill="#2a2206" opacity="0.85"/>
    <rect x="62.5" y="94.5" width="4" height="8" rx="1" fill="#ffe884" class="glow" opacity="0.8"/>
