<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" shape-rendering="crispEdges" role="img" aria-labelledby="title desc" data-creature-id="M015" data-stage="Rookie" data-type="Nature">
  <title id="title">Thornkit sprite</title>
  <desc id="desc">Original Rookie Nature pixel creature for Pixel Evolution Arena.</desc>
  <style><![CDATA[
    * { shape-rendering: crispEdges; }
    .idle { transform-box: fill-box; transform-origin: center bottom; animation: bob 2.56s steps(2, end) infinite; }
    .eyes { transform-box: fill-box; transform-origin: center; animation: blink 5.0s steps(1, end) infinite; }
    .glow { animation: glow 2.2s steps(2, end) infinite; }
    .scan { transform-box: fill-box; animation: scan 3.1s linear infinite; }
    .wing { transform-box: fill-box; transform-origin: center; animation: flap 1.6s ease-in-out infinite; }
    .wr { transform-origin: left center; }
    .wl { transform-origin: right center; }
    .flame { transform-box: fill-box; transform-origin: center bottom; animation: flick 0.5s steps(2, end) infinite; }
    .ember { animation: glow 0.9s steps(2, end) infinite; }
    .halo { animation: glow 2.6s ease-in-out infinite; }
    .drip { transform-box: fill-box; animation: drip 2.4s ease-in infinite; }
    .bob-leaf { transform-box: fill-box; transform-origin: center bottom; animation: sway 3.4s ease-in-out infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes blink { 0%, 46%, 54%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.12); } }
    @keyframes glow { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    @keyframes scan { 0% { transform: translateY(0); opacity: 0.05; } 50% { opacity: 0.35; } 100% { transform: translateY(28px); opacity: 0.05; } }
    @keyframes flap { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(0.7); } }
    @keyframes flick { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.18) translateY(-2px); } }
    @keyframes drip { 0%, 60% { transform: translateY(0); opacity: 0.9; } 90% { transform: translateY(6px); opacity: 0; } 100% { opacity: 0; } }
    @keyframes sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
    @media (prefers-reduced-motion: reduce) { .idle, .eyes, .glow, .scan, .wing, .flame, .ember, .halo, .drip, .bob-leaf { animation: none; } }
  ]]></style>
  <rect width="128" height="128" fill="none"/>
  <g class="idle" stroke="#06180f" stroke-width="0">
    
    <rect x="44" y="114" width="40" height="6" rx="3" fill="#000000" opacity="0.24"/>
    <polygon points="51,76 77,76 82,81 82,103 77,108 51,108 46,103 46,81" fill="#13693a"/>
    <polygon points="53,79 75,79 79,83 79,101 75,105 53,105 49,101 49,83" fill="#39c66f"/>
    <rect x="54.4" y="82" width="13.5" height="5.72" rx="2" fill="#c4ff8f" opacity="0.7"/>
    <rect x="49" y="105" width="9" height="8" rx="2" fill="#13693a"/>
    <rect x="70" y="105" width="9" height="8" rx="2" fill="#13693a"/>
    <rect x="51" y="108" width="3" height="3" fill="#b7ff5f" class="glow"/>
    <rect x="74" y="108" width="3" height="3" fill="#b7ff5f" class="glow"/>
    <polygon class="bob-leaf" points="62,82 48,74 60,70" fill="#c4ff8f"/>
    <polygon class="bob-leaf" points="66,82 80,74 68,70" fill="#b7ff5f"/>
    <rect x="63" y="70" width="3" height="14" fill="#13693a"/>
    <g class="eyes"><rect x="58" y="82" width="12" height="9" rx="2" fill="#06180f"/><rect x="61" y="85" width="6" height="5" fill="#b7ff5f" class="glow"/></g>
    <polygon points="59,94 69,94 67,98 61,98" fill="#06180f" opacity="0.85"/>
    <rect x="57.5" y="92" width="4" height="8" rx="1" fill="#b7ff5f" class="glow" opacity="0.8"/>
    <rect x="67.5" y="96" width="4" height="8" rx="1" fill="#b7ff5f" class="glow" opacity="0.8"/>
    <rect class="scan" x="48" y="76" width="32" height="3" fill="#eaffd0" opacity="0.2"/>
  </g>
</svg>
