<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" shape-rendering="crispEdges" role="img" aria-labelledby="title desc" data-creature-id="M009" data-stage="In-Training" data-type="Fire">
  <title id="title">Cinderpaw sprite</title>
  <desc id="desc">Original In-Training Fire pixel creature for Pixel Evolution Arena.</desc>
  <style><![CDATA[
    * { shape-rendering: crispEdges; }
    .idle { transform-box: fill-box; transform-origin: center bottom; animation: bob 2.68s steps(2, end) infinite; }
    .eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.4s steps(1, end) infinite; }
    .glow { animation: glow 2.2s steps(2, end) infinite; }
    .scan { transform-box: fill-box; animation: scan 3.1s linear infinite; }
    .wing { transform-box: fill-box; transform-origin: center; animation: flap 1.6s ease-in-out infinite; }
    .wr { transform-origin: left center; }
    .wl { transform-origin: right center; }
    .flame { transform-box: fill-box; transform-origin: center bottom; animation: flick 0.5s steps(2, end) infinite; }
    .ember { animation: glow 0.9s steps(2, end) infinite; }
    .halo { animation: glow 2.6s ease-in-out infinite; }
    .drip { transform-box: fill-box; animation: drip 2.4s ease-in infinite; }
    .bob-leaf { transform-box: fill-box; transform-origin: center bottom; animation: sway 3.4s ease-in-out infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes blink { 0%, 46%, 54%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.12); } }
    @keyframes glow { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    @keyframes scan { 0% { transform: translateY(0); opacity: 0.05; } 50% { opacity: 0.35; } 100% { transform: translateY(30px); opacity: 0.05; } }
    @keyframes flap { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(0.7); } }
    @keyframes flick { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.18) translateY(-2px); } }
    @keyframes drip { 0%, 60% { transform: translateY(0); opacity: 0.9; } 90% { transform: translateY(6px); opacity: 0; } 100% { opacity: 0; } }
    @keyframes sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
    @media (prefers-reduced-motion: reduce) { .idle, .eyes, .glow, .scan, .wing, .flame, .ember, .halo, .drip, .bob-leaf { animation: none; } }
  ]]></style>
  <rect width="128" height="128" fill="none"/>
  <g class="idle" stroke="#260803" stroke-width="0">
    
    <rect x="50" y="114" width="28" height="6" rx="3" fill="#000000" opacity="0.24"/>
    <polygon points="59,74 69,74 76,81 76,101 69,108 59,108 52,101 52,81" fill="#8a2208"/>
    <polygon points="61,77 67,77 73,83 73,99 67,105 61,105 55,99 55,83" fill="#ff6a1f"/>
    <rect x="58.24" y="80" width="8.1" height="6.16" rx="2" fill="#ffd23f" opacity="0.7"/>
    <polygon points="61,63 67,63 73,69 73,73 67,79 61,79 55,73 55,69" fill="#8a2208"/>
    <polygon points="62.5,65 65.5,65 70.5,70 70.5,71 65.5,76 62.5,76 57.5,71 57.5,70" fill="#ff6a1f"/>
    <polygon class="glow flame" points="64,45 55,63 73,63" fill="#ff9c24"/>
    <polygon class="glow flame" points="64,52 59,63 69,63" fill="#ffd23f"/>
    <rect x="50" y="57" width="3" height="3" fill="#ff9c24" class="ember"/>
    <rect x="76" y="54" width="3" height="3" fill="#ffd23f" class="ember"/>
    <g class="eyes"><rect x="54" y="67" width="7" height="8" rx="1" fill="#260803"/><rect x="67" y="67" width="7" height="8" rx="1" fill="#260803"/><rect x="56" y="69" width="3" height="4" fill="#ff9c24" class="glow"/><rect x="69" y="69" width="3" height="4" fill="#ff9c24" class="glow"/></g>
    <rect x="61" y="78" width="6" height="2" rx="1" fill="#260803" opacity="0.8"/>
    <rect x="62.5" y="91" width="4" height="8" rx="1" fill="#ff9c24" class="glow" opacity="0.8"/>
    <rect class="scan" x="54" y="74" width="20" height="3" fill="#fff1c2" opacity="0.2"/>
  </g>
</svg>
