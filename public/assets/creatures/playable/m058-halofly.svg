<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" shape-rendering="crispEdges" role="img" aria-labelledby="title desc" data-creature-id="M058" data-stage="Rookie" data-type="Light">
  <title id="title">Halofly sprite</title>
  <desc id="desc">Original Rookie Light pixel creature for Pixel Evolution Arena.</desc>
  <style><![CDATA[
    * { shape-rendering: crispEdges; }
    .idle { transform-box: fill-box; transform-origin: center bottom; animation: bob 2.56s steps(2, end) infinite; }
    .eyes { transform-box: fill-box; transform-origin: center; animation: blink 5.0s steps(1, end) infinite; }
    .glow { animation: glow 2.2s steps(2, end) infinite; }
    .scan { transform-box: fill-box; animation: scan 3.1s linear infinite; }
    .wing { transform-box: fill-box; transform-origin: center; animation: flap 1.6s ease-in-out infinite; }
    .wr { transform-origin: left center; }
    .wl { transform-origin: right center; }
    .flame { transform-box: fill-box; transform-origin: center bottom; animation: flick 0.5s steps(2, end) infinite; }
    .ember { animation: glow 0.9s steps(2, end) infinite; }
    .halo { animation: glow 2.6s ease-in-out infinite; }
    .drip { transform-box: fill-box; animation: drip 2.4s ease-in infinite; }
    .bob-leaf { transform-box: fill-box; transform-origin: center bottom; animation: sway 3.4s ease-in-out infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes blink { 0%, 46%, 54%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.12); } }
    @keyframes glow { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    @keyframes scan { 0% { transform: translateY(0); opacity: 0.05; } 50% { opacity: 0.35; } 100% { transform: translateY(23px); opacity: 0.05; } }
    @keyframes flap { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(0.7); } }
    @keyframes flick { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.18) translateY(-2px); } }
    @keyframes drip { 0%, 60% { transform: translateY(0); opacity: 0.9; } 90% { transform: translateY(6px); opacity: 0; } 100% { opacity: 0; } }
    @keyframes sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
    @media (prefers-reduced-motion: reduce) { .idle, .eyes, .glow, .scan, .wing, .flame, .ember, .halo, .drip, .bob-leaf { animation: none; } }
  ]]></style>
  <rect width="128" height="128" fill="none"/>
  <g class="idle" stroke="#2a2206" stroke-width="0">
    
    <rect x="42.5" y="114" width="43" height="6" rx="3" fill="#000000" opacity="0.24"/>
    <polygon points="50.5,81 77.5,81 83.5,87 83.5,102 77.5,108 50.5,108 44.5,102 44.5,87" fill="#9a7a14"/>
    <polygon points="52.5,84 75.5,84 80.5,89 80.5,100 75.5,105 52.5,105 47.5,100 47.5,89" fill="#ffce3a"/>
    <rect x="53.44" y="87" width="14.85" height="4.62" rx="2" fill="#fff4bd" opacity="0.7"/>
    <polygon points="56,67 72,67 77,72 77,83 72,88 56,88 51,83 51,72" fill="#9a7a14"/>
    <polygon points="57.5,69 70.5,69 74.5,73 74.5,81 70.5,85 57.5,85 53.5,81 53.5,73" fill="#ffce3a"/>
    <rect x="47.5" y="105" width="9" height="8" rx="2" fill="#9a7a14"/>
    <rect x="71.5" y="105" width="9" height="8" rx="2" fill="#9a7a14"/>
    <rect x="49.5" y="108" width="3" height="3" fill="#ffe884" class="glow"/>
    <rect x="75.5" y="108" width="3" height="3" fill="#ffe884" class="glow"/>
    <ellipse class="glow halo" cx="64" cy="57" rx="10.92" ry="4" fill="none" stroke="#ffe884" stroke-width="3"/>
    <rect x="63" y="49" width="3" height="6" fill="#fffbe6" class="glow"/>
    <g class="eyes"><rect x="54" y="73.5" width="7" height="8" rx="1" fill="#2a2206"/><rect x="67" y="73.5" width="7" height="8" rx="1" fill="#2a2206"/><rect x="56" y="75.5" width="3" height="4" fill="#ffe884" class="glow"/><rect x="69" y="75.5" width="3" height="4" fill="#ffe884" class="glow"/></g>
    <polygon points="59,84.5 69,84.5 67,88.5 61,88.5" fill="#2a2206" opacity="0.85"/>
    <rect x="57.5" y="94.5" width="4" height="8" rx="1" fill="#ffe884" class="glow" opacity="0.8"/>
    <rect x="67.5" y="98.5" width="4" height="8" rx="1" fill="#ffe884" class="glow" opacity="0.8"/>
    <rect class="scan" x="46.5" y="81" width="35" height="3" fill="#fffbe6" opacity="0.2"/>
  </g>
</svg>
