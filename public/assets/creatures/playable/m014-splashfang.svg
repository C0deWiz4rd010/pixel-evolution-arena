    <g class="eyes"><rect x="54" y="73" width="7" height="8" rx="1" fill="#041826"/><rect x="67" y="73" width="7" height="8" rx="1" fill="#041826"/><rect x="56" y="75" width="3" height="4" fill="#36d6ff" class="glow"/><rect x="69" y="75" width="3" height="4" fill="#36d6ff" class="glow"/></g>
    <polygon points="59,84 69,84 67,88 61,88" fill="#041826" opacity="0.85"/>
    <rect x="57.5" y="94.5" width="4" height="8" rx="1" fill="#36d6ff" class="glow" opacity="0.8"/>
