<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" shape-rendering="crispEdges" role="img" aria-labelledby="title desc" data-creature-id="M004" data-stage="Baby" data-type="Dark">
  <title id="title">Shadepuff sprite</title>
  <desc id="desc">Original Baby Dark pixel creature for Pixel Evolution Arena.</desc>
  <style><![CDATA[
    * { shape-rendering: crispEdges; }
    .idle { transform-box: fill-box; transform-origin: center bottom; animation: bob 2.80s steps(2, end) infinite; }
    .eyes { transform-box: fill-box; transform-origin: center; animation: blink 3.8s steps(1, end) infinite; }
    .glow { animation: glow 2.2s steps(2, end) infinite; }
    .scan { transform-box: fill-box; animation: scan 3.1s linear infinite; }
    .wing { transform-box: fill-box; transform-origin: center; animation: flap 1.6s ease-in-out infinite; }
    .wr { transform-origin: left center; }
    .wl { transform-origin: right center; }
    .flame { transform-box: fill-box; transform-origin: center bottom; animation: flick 0.5s steps(2, end) infinite; }
    .ember { animation: glow 0.9s steps(2, end) infinite; }
    .halo { animation: glow 2.6s ease-in-out infinite; }
    .drip { transform-box: fill-box; animation: drip 2.4s ease-in infinite; }
    .bob-leaf { transform-box: fill-box; transform-origin: center bottom; animation: sway 3.4s ease-in-out infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes blink { 0%, 46%, 54%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.12); } }
    @keyframes glow { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    @keyframes scan { 0% { transform: translateY(0); opacity: 0.05; } 50% { opacity: 0.35; } 100% { transform: translateY(17px); opacity: 0.05; } }
    @keyframes flap { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(0.7); } }
    @keyframes flick { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.18) translateY(-2px); } }
    @keyframes drip { 0%, 60% { transform: translateY(0); opacity: 0.9; } 90% { transform: translateY(6px); opacity: 0; } 100% { opacity: 0; } }
    @keyframes sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
    @media (prefers-reduced-motion: reduce) { .idle, .eyes, .glow, .scan, .wing, .flame, .ember, .halo, .drip, .bob-leaf { animation: none; } }
  ]]></style>
  <rect width="128" height="128" fill="none"/>
  <g class="idle" stroke="#070310" stroke-width="0">
    
    <rect x="47" y="114" width="34" height="6" rx="3" fill="#000000" opacity="0.24"/>
    <polygon points="54,87 74,87 79,92 79,103 74,108 54,108 49,103 49,92" fill="#241548"/>
    <polygon points="56,90 72,90 76,94 76,101 72,105 56,105 52,101 52,94" fill="#6f54f0"/>
    <rect x="56.32" y="93" width="10.8" height="3.3" rx="2" fill="#c79bff" opacity="0.7"/>
    <polygon points="52,93 44,79 58,89" fill="#241548"/>
    <polygon points="76,93 84,79 70,89" fill="#241548"/>
    <rect x="45" y="79" width="3" height="3" fill="#d95dff" class="glow"/>
    <rect x="80" y="79" width="3" height="3" fill="#d95dff" class="glow"/>
    <g class="eyes"><rect x="54" y="90" width="7" height="8" rx="1" fill="#070310"/><rect x="67" y="90" width="7" height="8" rx="1" fill="#070310"/><rect x="56" y="92" width="3" height="4" fill="#d95dff" class="glow"/><rect x="69" y="92" width="3" height="4" fill="#d95dff" class="glow"/></g>
    <rect x="61" y="101" width="6" height="2" rx="1" fill="#070310" opacity="0.8"/>
    <rect x="57.5" y="97.5" width="4" height="8" rx="1" fill="#d95dff" class="glow" opacity="0.8"/>
    <rect x="67.5" y="101.5" width="4" height="8" rx="1" fill="#d95dff" class="glow" opacity="0.8"/>
    <rect class="scan" x="51" y="87" width="26" height="3" fill="#f0d8ff" opacity="0.2"/>
  </g>
</svg>
