    <polygon points="51.5,49 76.5,49 82.5,55 82.5,75 76.5,81 51.5,81 45.5,75 45.5,55" fill="#9a7a14"/>
    <polygon points="53,51 75,51 80,56 80,73 75,78 53,78 48,73 48,56" fill="#ffce3a"/>
    <rect x="44" y="105" width="9" height="8" rx="2" fill="#9a7a14"/>
    <rect x="75" y="105" width="9" height="8" rx="2" fill="#9a7a14"/>
    <rect x="46" y="108" width="3" height="3" fill="#ffe884" class="glow"/>
    <rect x="79" y="108" width="3" height="3" fill="#ffe884" class="glow"/>
    <rect x="36" y="84.2" width="7" height="13.2" rx="2" fill="#9a7a14"/>
    <rect x="85" y="84.2" width="7" height="13.2" rx="2" fill="#9a7a14"/>
    <ellipse class="glow halo" cx="64" cy="39" rx="15.54" ry="4" fill="none" stroke="#ffe884" stroke-width="3"/>
    <rect x="63" y="31" width="3" height="6" fill="#fffbe6" class="glow"/>
    <g class="eyes"><rect x="51.42" y="62" width="25.16" height="6" rx="2" fill="#2a2206"/><rect x="52.9" y="63" width="22.2" height="3" fill="#ffe884" class="glow"/></g>
    <polygon points="59,72 69,72 67,76 61,76" fill="#2a2206" opacity="0.85"/>
    <rect x="57.5" y="87.5" width="4" height="8" rx="1" fill="#ffe884" class="glow" opacity="0.8"/>
    <rect x="67.5" y="91.5" width="4" height="8" rx="1" fill="#ffe884" class="glow" opacity="0.8"/>
