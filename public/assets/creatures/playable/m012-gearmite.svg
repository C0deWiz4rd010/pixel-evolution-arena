    <polygon points="53.5,69 74.5,69 77.5,72 77.5,91 74.5,94 53.5,94 50.5,91 50.5,72" fill="#34505c"/>
    <polygon points="55,71 73,71 75,73 75,89 73,91 55,91 53,89 53,73" fill="#7fa6b6"/>
    <rect x="63" y="53" width="3" height="14" fill="#34505c"/>
    <rect x="61" y="49" width="7" height="7" rx="1" fill="#37e0ff" class="glow"/>
    <rect x="47.5" y="79.5" width="4" height="4" fill="#d4ecf5"/>
    <rect x="76.5" y="79.5" width="4" height="4" fill="#d4ecf5"/>
    <g class="eyes"><rect x="54" y="77.5" width="7" height="8" rx="1" fill="#091318"/><rect x="67" y="77.5" width="7" height="8" rx="1" fill="#091318"/><rect x="56" y="79.5" width="3" height="4" fill="#37e0ff" class="glow"/><rect x="69" y="79.5" width="3" height="4" fill="#37e0ff" class="glow"/></g>
    <rect x="61" y="88.5" width="6" height="2" rx="1" fill="#091318" opacity="0.8"/>
    <rect x="57.5" y="97" width="4" height="8" rx="1" fill="#37e0ff" class="glow" opacity="0.8"/>
    <rect x="67.5" y="101" width="4" height="8" rx="1" fill="#37e0ff" class="glow" opacity="0.8"/>
    <rect class="scan" x="47.5" y="86" width="33" height="3" fill="#eafaff" opacity="0.2"/>
  </g>
</svg>
