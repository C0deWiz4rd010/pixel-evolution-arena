    <polygon points="52,66 76,66 82,72 82,86 76,92 52,92 46,86 46,72" fill="#39c66f"/>
    <rect x="50" y="70" width="15" height="6" fill="#ecffd1" opacity="0.75"/>
    <rect x="56" y="83" width="4" height="12" fill="#b7ff5f" class="glow" opacity="0.72"/>
    <rect x="60" y="77" width="4" height="12" fill="#b7ff5f" class="glow" opacity="0.72"/>
