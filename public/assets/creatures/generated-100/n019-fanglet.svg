    <polygon points="52,70 76,70 82,76 82,86 76,92 52,92 46,86 46,76" fill="#c57a3b"/>
    <rect x="50" y="74" width="15" height="6" fill="#ffe7c7" opacity="0.75"/>
    <rect x="62" y="80" width="4" height="12" fill="#ffd08a" class="glow" opacity="0.72"/>
    <g class="eyes">
    <rect x="49" y="77" width="4" height="6" fill="#221005"/>
