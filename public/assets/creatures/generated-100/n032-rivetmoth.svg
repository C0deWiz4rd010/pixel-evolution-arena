  <title id="title">N032 Rivetmoth sprite</title>
  <desc id="desc">Original Rookie Machine pixel creature for Pixel Evolution Arena. Mechanical moth with rivet wings; utility speed and item-drop fantasy.</desc>
  <style><![CDATA[
    * { shape-rendering: crispEdges; }
    .idle { transform-box: fill-box; transform-origin: center bottom; animation: bob 2.5s steps(2, end) infinite; }
