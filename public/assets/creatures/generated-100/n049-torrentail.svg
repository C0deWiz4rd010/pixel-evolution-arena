  <title id="title">N049 Torrentail sprite</title>
  <desc id="desc">Original Champion Water pixel creature for Pixel Evolution Arena. Long-tailed wave beast; reliable damage and XP farming core.</desc>
  <style><![CDATA[
    * { shape-rendering: crispEdges; }
    .idle { transform-box: fill-box; transform-origin: center bottom; animation: bob 2.4s steps(2, end) infinite; }
