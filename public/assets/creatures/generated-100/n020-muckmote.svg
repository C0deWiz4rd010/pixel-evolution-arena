    <rect x="49" y="92" width="8" height="8" fill="#315700"/>
    <rect x="71" y="92" width="8" height="8" fill="#315700"/>
    <polygon points="50,58 78,58 86,66 86,88 78,96 50,96 42,88 42,66" fill="#315700"/>
    <polygon points="52,62 76,62 82,68 82,86 76,92 52,92 46,86 46,68" fill="#91e536"/>
    <rect x="50" y="66" width="15" height="6" fill="#f6ffb8" opacity="0.75"/>
