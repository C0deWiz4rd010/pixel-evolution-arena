  <title id="title">N030 Umbracrow sprite</title>
  <desc id="desc">Original Rookie Dark pixel creature for Pixel Evolution Arena. Crow silhouette with neon beak; fast dark finisher.</desc>
  <style><![CDATA[
    * { shape-rendering: crispEdges; }
    .idle { transform-box: fill-box; transform-origin: center bottom; animation: bob 2.5s steps(2, end) infinite; }
