  <title id="title">N085 Haloarch sprite</title>
  <desc id="desc">Original Mega Light pixel creature for Pixel Evolution Arena. Arched halo guardian with wing panels; speed-support prestige.</desc>
  <style><![CDATA[
    * { shape-rendering: crispEdges; }
    .idle { transform-box: fill-box; transform-origin: center bottom; animation: bob 2.3s steps(2, end) infinite; }
    .eyes { transform-box: fill-box; transform-origin: center; animation: blink 5.2s steps(1, end) infinite; }
    .glow { animation: glow 2.2s steps(2, end) infinite; }
    .scan { animation: scan 3.1s linear infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes blink { 0%, 44%, 52%, 100% { transform: scaleY(1); } 48% { transform: scaleY(0.12); } }
    @keyframes glow { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.88; } }
    @keyframes scan { 0% { transform: translateY(-4px); opacity: 0.15; } 50% { opacity: 0.5; } 100% { transform: translateY(7px); opacity: 0.15; } }
    @media (prefers-reduced-motion: reduce) { .idle, .eyes, .glow, .scan { animation: none; } }
  ]]></style>
