<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" shape-rendering="crispEdges" role="img" aria-labelledby="title desc" data-creature-id="N005" data-stage="Baby" data-type="Light">
  <title id="title">N005 Halopeb sprite</title>
  <desc id="desc">Original Baby Light pixel creature for Pixel Evolution Arena. Pebble halo with tiny legs; quick support flavor and anti-bad-luck logs.</desc>
  <style><![CDATA[
    * { shape-rendering: crispEdges; }
    .idle { transform-box: fill-box; transform-origin: center bottom; animation: bob 2.8s steps(2, end) infinite; }
    .eyes { transform-box: fill-box; transform-origin: center; animation: blink 5.2s steps(1, end) infinite; }
    .glow { animation: glow 2.2s steps(2, end) infinite; }
    .scan { animation: scan 3.82s linear infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes blink { 0%, 44%, 52%, 100% { transform: scaleY(1); } 48% { transform: scaleY(0.12); } }
    @keyframes glow { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.88; } }
    @keyframes scan { 0% { transform: translateY(-4px); opacity: 0.15; } 50% { opacity: 0.5; } 100% { transform: translateY(7px); opacity: 0.15; } }
    @media (prefers-reduced-motion: reduce) { .idle, .eyes, .glow, .scan { animation: none; } }
  ]]></style>
  <rect width="128" height="128" fill="none"/>
  <g class="idle" stroke="#2a2305" stroke-width="0" stroke-linejoin="miter">
    <rect x="32" y="98" width="64" height="6" fill="#000000" opacity="0.22"/>
    <rect x="46" y="56" width="36" height="4" fill="#ffffff" class="glow"/>
    <rect x="42" y="60" width="6" height="4" fill="#ffffff" class="glow"/>
    <rect x="80" y="60" width="6" height="4" fill="#ffffff" class="glow"/>
    <rect x="71" y="74" width="8" height="8" fill="#fff9c7" class="glow"/>
    <rect x="75" y="70" width="2" height="16" fill="#fff9c7" class="glow"/>
    <rect x="50" y="88" width="8" height="8" fill="#846414"/>
    <rect x="70" y="88" width="8" height="8" fill="#846414"/>
    <polygon points="55,66 73,66 81,74 81,84 73,92 55,92 47,84 47,74" fill="#846414"/>
    <polygon points="57,70 71,70 77,76 77,82 71,88 57,88 51,82 51,76" fill="#ffe46c"/>
    <rect x="55" y="74" width="12" height="6" fill="#fff9c7" opacity="0.75"/>
    <rect x="60" y="78" width="4" height="12" fill="#ffffff" class="glow" opacity="0.72"/>
    <rect x="62" y="84" width="4" height="12" fill="#ffffff" class="glow" opacity="0.72"/>
    <rect x="65" y="78" width="4" height="12" fill="#ffffff" class="glow" opacity="0.72"/>
    <g class="eyes">
    <rect x="51" y="76" width="4" height="6" fill="#2a2305"/>
    <rect x="73" y="76" width="4" height="6" fill="#2a2305"/>
    </g>
  </g>
</svg>
