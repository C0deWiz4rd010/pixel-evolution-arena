  <title id="title">N040 Gearfinch sprite</title>
  <desc id="desc">Original Rookie Machine pixel creature for Pixel Evolution Arena. Clockwork finch with rotating crest; rare item-finder archetype.</desc>
  <style><![CDATA[
    * { shape-rendering: crispEdges; }
    .idle { transform-box: fill-box; transform-origin: center bottom; animation: bob 2.5s steps(2, end) infinite; }
