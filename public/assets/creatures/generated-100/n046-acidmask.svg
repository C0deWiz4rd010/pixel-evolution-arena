  <title id="title">N046 Acidmask sprite</title>
  <desc id="desc">Original Rookie Toxic pixel creature for Pixel Evolution Arena. Masked ooze sprinter; rare toxic glass-cannon chase.</desc>
  <style><![CDATA[
    * { shape-rendering: crispEdges; }
    .idle { transform-box: fill-box; transform-origin: center bottom; animation: bob 2.5s steps(2, end) infinite; }
