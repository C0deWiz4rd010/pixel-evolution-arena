<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" shape-rendering="crispEdges" role="img" aria-labelledby="title desc" data-creature-id="N002" data-stage="Baby" data-type="Fire">
  <title id="title">N002 Cinderpip sprite</title>
  <desc id="desc">Original Baby Fire pixel creature for Pixel Evolution Arena. Tiny coal chick with pixel ember tail; fast opener for first battles.</desc>
  <style><![CDATA[
    * { shape-rendering: crispEdges; }
    .idle { transform-box: fill-box; transform-origin: center bottom; animation: bob 2.8s steps(2, end) infinite; }
    .eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.45s steps(1, end) infinite; }
    .glow { animation: glow 2.4s steps(2, end) infinite; }
    .scan { animation: scan 3.28s linear infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes blink { 0%, 44%, 52%, 100% { transform: scaleY(1); } 48% { transform: scaleY(0.12); } }
    @keyframes glow { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.88; } }
    @keyframes scan { 0% { transform: translateY(-4px); opacity: 0.15; } 50% { opacity: 0.5; } 100% { transform: translateY(7px); opacity: 0.15; } }
    @media (prefers-reduced-motion: reduce) { .idle, .eyes, .glow, .scan { animation: none; } }
  ]]></style>
  <rect width="128" height="128" fill="none"/>
  <g class="idle" stroke="#260704" stroke-width="0" stroke-linejoin="miter">
    <rect x="32" y="98" width="64" height="6" fill="#000000" opacity="0.22"/>
    <polygon points="64,50 54,74 66,70" fill="#ffd05a" class="glow"/>
    <polygon points="72,58 66,78 82,74" fill="#ff7134" class="glow"/>
    <polygon points="54,62 44,80 60,74" fill="#fff0bd" opacity="0.85"/>
    <rect x="50" y="88" width="8" height="8" fill="#7b1d12"/>
    <rect x="70" y="88" width="8" height="8" fill="#7b1d12"/>
    <polygon points="55,62 73,62 81,70 81,84 73,92 55,92 47,84 47,70" fill="#7b1d12"/>
    <polygon points="57,66 71,66 77,72 77,82 71,88 57,88 51,82 51,72" fill="#ff7134"/>
    <rect x="55" y="70" width="12" height="6" fill="#fff0bd" opacity="0.75"/>
    <rect x="62" y="76" width="4" height="12" fill="#ffd05a" class="glow" opacity="0.72"/>
    <g class="eyes">
    <rect x="51" y="73" width="4" height="6" fill="#260704"/>
    <rect x="73" y="73" width="4" height="6" fill="#260704"/>
    </g>
  </g>
</svg>
