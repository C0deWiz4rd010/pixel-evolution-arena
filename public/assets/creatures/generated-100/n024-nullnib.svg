<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" shape-rendering="crispEdges" role="img" aria-labelledby="title desc" data-creature-id="N024" data-stage="In-Training" data-type="Dark">
  <title id="title">N024 Nullnib sprite</title>
  <desc id="desc">Original In-Training Dark pixel creature for Pixel Evolution Arena. Pen-nib shadow imp; marks enemies in battle logs.</desc>
  <style><![CDATA[
    * { shape-rendering: crispEdges; }
    .idle { transform-box: fill-box; transform-origin: center bottom; animation: bob 2.6s steps(2, end) infinite; }
    .eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.95s steps(1, end) infinite; }
    .glow { animation: glow 2.8s steps(2, end) infinite; }
    .scan { animation: scan 4s linear infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes blink { 0%, 44%, 52%, 100% { transform: scaleY(1); } 48% { transform: scaleY(0.12); } }
    @keyframes glow { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.88; } }
    @keyframes scan { 0% { transform: translateY(-4px); opacity: 0.15; } 50% { opacity: 0.5; } 100% { transform: translateY(7px); opacity: 0.15; } }
    @media (prefers-reduced-motion: reduce) { .idle, .eyes, .glow, .scan { animation: none; } }
  ]]></style>
  <rect width="128" height="128" fill="none"/>
  <g class="idle" stroke="#070310" stroke-width="0" stroke-linejoin="miter">
    <rect x="32" y="102" width="64" height="6" fill="#000000" opacity="0.22"/>
