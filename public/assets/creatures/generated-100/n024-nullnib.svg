    <polygon points="53,66 75,66 81,72 81,86 75,92 53,92 47,86 47,72" fill="#7255f6"/>
    <rect x="51" y="70" width="14" height="6" fill="#f0c6ff" opacity="0.75"/>
    <rect x="58" y="77" width="4" height="12" fill="#d95dff" class="glow" opacity="0.72"/>
