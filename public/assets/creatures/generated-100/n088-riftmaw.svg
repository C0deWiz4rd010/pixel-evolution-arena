  <desc id="desc">Original Mega Beast pixel creature for Pixel Evolution Arena. Wide-jawed rift beast with data scars; dark-beast bruiser endpoint.</desc>
  <style><![CDATA[
    * { shape-rendering: crispEdges; }
    .idle { transform-box: fill-box; transform-origin: center bottom; animation: bob 2.3s steps(2, end) infinite; }
