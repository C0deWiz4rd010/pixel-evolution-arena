  <title id="title">N062 Tidalglass sprite</title>
  <desc id="desc">Original Champion Water pixel creature for Pixel Evolution Arena. Glassy seahorse guardian; reflect-tank concept and safe loss rewards.</desc>
  <style><![CDATA[
    * { shape-rendering: crispEdges; }
    .idle { transform-box: fill-box; transform-origin: center bottom; animation: bob 2.4s steps(2, end) infinite; }
