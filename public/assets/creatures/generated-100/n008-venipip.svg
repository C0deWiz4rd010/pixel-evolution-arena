<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" shape-rendering="crispEdges" role="img" aria-labelledby="title desc" data-creature-id="N008" data-stage="Baby" data-type="Toxic">
  <title id="title">N008 Venipip sprite</title>
  <desc id="desc">Original Baby Toxic pixel creature for Pixel Evolution Arena. Wobbling vial tadpole; weak hits but early poison-log identity.</desc>
  <style><![CDATA[
    * { shape-rendering: crispEdges; }
    .idle { transform-box: fill-box; transform-origin: center bottom; animation: bob 2.8s steps(2, end) infinite; }
    .eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.7s steps(1, end) infinite; }
    .glow { animation: glow 2.8s steps(2, end) infinite; }
    .scan { animation: scan 3.28s linear infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes blink { 0%, 44%, 52%, 100% { transform: scaleY(1); } 48% { transform: scaleY(0.12); } }
    @keyframes glow { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.88; } }
    @keyframes scan { 0% { transform: translateY(-4px); opacity: 0.15; } 50% { opacity: 0.5; } 100% { transform: translateY(7px); opacity: 0.15; } }
    @media (prefers-reduced-motion: reduce) { .idle, .eyes, .glow, .scan { animation: none; } }
  ]]></style>
  <rect width="128" height="128" fill="none"/>
  <g class="idle" stroke="#102000" stroke-width="0" stroke-linejoin="miter">
    <rect x="32" y="98" width="64" height="6" fill="#000000" opacity="0.22"/>
    <rect x="52" y="54" width="24" height="8" fill="#e4ff47" class="glow"/>
    <rect x="56" y="48" width="16" height="6" fill="#f6ffb8" opacity="0.8"/>
    <rect x="54" y="74" width="8" height="8" fill="#e4ff47" class="glow"/>
    <rect x="66" y="84" width="10" height="10" fill="#f6ffb8" class="glow" opacity="0.7"/>
    <rect x="64" y="88" width="6" height="12" fill="#e4ff47" class="glow"/>
    <rect x="50" y="88" width="8" height="8" fill="#315700"/>
    <rect x="70" y="88" width="8" height="8" fill="#315700"/>
    <polygon points="54,62 74,62 82,70 82,84 74,92 54,92 46,84 46,70" fill="#315700"/>
    <polygon points="56,66 72,66 78,72 78,82 72,88 56,88 50,82 50,72" fill="#91e536"/>
    <rect x="54" y="70" width="12" height="6" fill="#f6ffb8" opacity="0.75"/>
    <rect x="62" y="76" width="4" height="12" fill="#e4ff47" class="glow" opacity="0.72"/>
    <g class="eyes">
    <rect x="51" y="73" width="4" height="6" fill="#102000"/>
    <rect x="73" y="73" width="4" height="6" fill="#102000"/>
    </g>
    <rect x="70" y="62" width="8" height="8" fill="#f6ffb8" class="glow" opacity="0.78"/>
    <rect x="50" y="70" width="6" height="6" fill="#e4ff47" class="glow" opacity="0.72"/>
  </g>
</svg>
