    <rect x="81" y="64" width="2" height="16" fill="#fff9c7" class="glow"/>
    <rect x="48" y="92" width="8" height="8" fill="#846414"/>
    <rect x="72" y="92" width="8" height="8" fill="#846414"/>
    <polygon points="49,60 79,60 87,68 87,88 79,96 49,96 41,88 41,68" fill="#846414"/>
    <polygon points="51,64 77,64 83,70 83,86 77,92 51,92 45,86 45,70" fill="#ffe46c"/>
    <rect x="49" y="68" width="16" height="6" fill="#fff9c7" opacity="0.75"/>
    <rect x="62" y="76" width="4" height="12" fill="#ffffff" class="glow" opacity="0.72"/>
