  <title id="title">N041 Talonroll sprite</title>
  <desc id="desc">Original Rookie Beast pixel creature for Pixel Evolution Arena. Armored rolling raptor chick; speed bruiser with combo logs.</desc>
  <style><![CDATA[
    * { shape-rendering: crispEdges; }
    .idle { transform-box: fill-box; transform-origin: center bottom; animation: bob 2.5s steps(2, end) infinite; }
