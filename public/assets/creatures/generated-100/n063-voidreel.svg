  <title id="title">N063 Voidreel sprite</title>
  <desc id="desc">Original Champion Dark pixel creature for Pixel Evolution Arena. Film-reel shadow serpent; log-control fantasy and rare dark chase.</desc>
  <style><![CDATA[
    * { shape-rendering: crispEdges; }
    .idle { transform-box: fill-box; transform-origin: center bottom; animation: bob 2.4s steps(2, end) infinite; }
