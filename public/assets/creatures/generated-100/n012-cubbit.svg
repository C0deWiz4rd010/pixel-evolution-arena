    <polygon points="56,72 72,72 78,78 78,82 72,88 56,88 50,82 50,78" fill="#c57a3b"/>
    <rect x="54" y="76" width="12" height="6" fill="#ffe7c7" opacity="0.75"/>
    <rect x="58" y="85" width="4" height="12" fill="#ffd08a" class="glow" opacity="0.72"/>
    <rect x="61" y="79" width="4" height="12" fill="#ffd08a" class="glow" opacity="0.72"/>
    <rect x="63" y="85" width="4" height="12" fill="#ffd08a" class="glow" opacity="0.72"/>
