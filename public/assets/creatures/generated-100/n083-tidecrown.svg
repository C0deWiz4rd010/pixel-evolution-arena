  <title id="title">N083 Tidecrown sprite</title>
  <desc id="desc">Original Mega Water pixel creature for Pixel Evolution Arena. Crowned leviathan-like wave crest; durable reward farmer.</desc>
  <style><![CDATA[
    * { shape-rendering: crispEdges; }
    .idle { transform-box: fill-box; transform-origin: center bottom; animation: bob 2.3s steps(2, end) infinite; }
