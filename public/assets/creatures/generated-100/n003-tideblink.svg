<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" shape-rendering="crispEdges" role="img" aria-labelledby="title desc" data-creature-id="N003" data-stage="Baby" data-type="Water">
  <title id="title">N003 Tideblink sprite</title>
  <desc id="desc">Original Baby Water pixel creature for Pixel Evolution Arena. Teardrop sprite with blinking fin; balanced HP and reward-farm comfort.</desc>
  <style><![CDATA[
    * { shape-rendering: crispEdges; }
    .idle { transform-box: fill-box; transform-origin: center bottom; animation: bob 2.8s steps(2, end) infinite; }
    .eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.7s steps(1, end) infinite; }
    .glow { animation: glow 2.6s steps(2, end) infinite; }
    .scan { animation: scan 3.46s linear infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes blink { 0%, 44%, 52%, 100% { transform: scaleY(1); } 48% { transform: scaleY(0.12); } }
    @keyframes glow { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.88; } }
    @keyframes scan { 0% { transform: translateY(-4px); opacity: 0.15; } 50% { opacity: 0.5; } 100% { transform: translateY(7px); opacity: 0.15; } }
    @media (prefers-reduced-motion: reduce) { .idle, .eyes, .glow, .scan { animation: none; } }
  ]]></style>
  <rect width="128" height="128" fill="none"/>
  <g class="idle" stroke="#041826" stroke-width="0" stroke-linejoin="miter">
    <rect x="32" y="98" width="64" height="6" fill="#000000" opacity="0.22"/>
    <polygon points="36,82 18,96 38,102" fill="#9df7ff"/>
    <polygon points="92,82 110,96 90,102" fill="#d6fdff"/>
    <rect x="46" y="94" width="12" height="4" fill="#9df7ff" class="glow"/>
    <rect x="62" y="94" width="14" height="4" fill="#d6fdff" class="glow"/>
    <rect x="50" y="88" width="8" height="8" fill="#0b4b76"/>
    <rect x="70" y="88" width="8" height="8" fill="#0b4b76"/>
    <polygon points="54,64 74,64 82,72 82,84 74,92 54,92 46,84 46,72" fill="#0b4b76"/>
    <polygon points="56,68 72,68 78,74 78,82 72,88 56,88 50,82 50,74" fill="#39b9ff"/>
    <rect x="54" y="72" width="12" height="6" fill="#d6fdff" opacity="0.75"/>
    <rect x="59" y="77" width="4" height="12" fill="#9df7ff" class="glow" opacity="0.72"/>
    <rect x="62" y="83" width="4" height="12" fill="#9df7ff" class="glow" opacity="0.72"/>
    <rect x="65" y="77" width="4" height="12" fill="#9df7ff" class="glow" opacity="0.72"/>
    <g class="eyes">
    <rect x="51" y="75" width="4" height="6" fill="#041826"/>
    <rect x="73" y="75" width="4" height="6" fill="#041826"/>
    </g>
    <polygon points="46,62 54,48 64,60 74,48 82,62" fill="#9df7ff" class="glow"/>
  </g>
</svg>
