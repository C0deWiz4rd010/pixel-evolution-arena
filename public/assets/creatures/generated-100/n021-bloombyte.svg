<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" shape-rendering="crispEdges" role="img" aria-labelledby="title desc" data-creature-id="N021" data-stage="In-Training" data-type="Nature">
  <title id="title">N021 Bloombyte sprite</title>
  <desc id="desc">Original In-Training Nature pixel creature for Pixel Evolution Arena. Pixel bud with two data leaves; sustain-focused bridge creature.</desc>
  <style><![CDATA[
    * { shape-rendering: crispEdges; }
    .idle { transform-box: fill-box; transform-origin: center bottom; animation: bob 2.6s steps(2, end) infinite; }
    .eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.2s steps(1, end) infinite; }
    .glow { animation: glow 2.2s steps(2, end) infinite; }
    .scan { animation: scan 3.46s linear infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes blink { 0%, 44%, 52%, 100% { transform: scaleY(1); } 48% { transform: scaleY(0.12); } }
    @keyframes glow { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.88; } }
    @keyframes scan { 0% { transform: translateY(-4px); opacity: 0.15; } 50% { opacity: 0.5; } 100% { transform: translateY(7px); opacity: 0.15; } }
    @media (prefers-reduced-motion: reduce) { .idle, .eyes, .glow, .scan { animation: none; } }
  ]]></style>
  <rect width="128" height="128" fill="none"/>
  <g class="idle" stroke="#06180f" stroke-width="0" stroke-linejoin="miter">
    <rect x="32" y="102" width="64" height="6" fill="#000000" opacity="0.22"/>
    <polygon points="57,64 34,74 50,84" fill="#b7ff5f"/>
    <polygon points="71,64 94,74 78,84" fill="#ecffd1"/>
    <rect x="61" y="74" width="6" height="14" fill="#124a2c"/>
    <rect x="48" y="92" width="8" height="8" fill="#124a2c"/>
    <rect x="72" y="92" width="8" height="8" fill="#124a2c"/>
    <polygon points="49,62 79,62 87,70 87,88 79,96 49,96 41,88 41,70" fill="#124a2c"/>
    <polygon points="51,66 77,66 83,72 83,86 77,92 51,92 45,86 45,72" fill="#39c66f"/>
    <rect x="49" y="70" width="16" height="6" fill="#ecffd1" opacity="0.75"/>
    <rect x="58" y="83" width="4" height="12" fill="#b7ff5f" class="glow" opacity="0.72"/>
    <rect x="66" y="77" width="4" height="12" fill="#b7ff5f" class="glow" opacity="0.72"/>
    <g class="eyes">
    <rect x="49" y="75" width="4" height="6" fill="#06180f"/>
    <rect x="75" y="75" width="4" height="6" fill="#06180f"/>
    </g>
