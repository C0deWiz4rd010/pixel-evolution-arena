  <title id="title">N057 Dreadveil sprite</title>
  <desc id="desc">Original Champion Dark pixel creature for Pixel Evolution Arena. Veiled mantis shadow; debuff striker for crit teams.</desc>
  <style><![CDATA[
    * { shape-rendering: crispEdges; }
    .idle { transform-box: fill-box; transform-origin: center bottom; animation: bob 2.4s steps(2, end) infinite; }
