  <title id="title">N069 Abyssalynx sprite</title>
  <desc id="desc">Original Ultimate Water pixel creature for Pixel Evolution Arena. Deep-water lynx with fin mane; durable striker for win streaks.</desc>
  <style><![CDATA[
    * { shape-rendering: crispEdges; }
    .idle { transform-box: fill-box; transform-origin: center bottom; animation: bob 2.35s steps(2, end) infinite; }
