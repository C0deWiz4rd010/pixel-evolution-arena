<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" shape-rendering="crispEdges" role="img" aria-labelledby="title desc" data-creature-id="N010" data-stage="Baby" data-type="Fire">
  <title id="title">N010 Flarebud sprite</title>
  <desc id="desc">Original Baby Fire pixel creature for Pixel Evolution Arena. Closed flower bud with flame petals; coin-efficient attacker seed.</desc>
  <style><![CDATA[
    * { shape-rendering: crispEdges; }
    .idle { transform-box: fill-box; transform-origin: center bottom; animation: bob 2.8s steps(2, end) infinite; }
    .eyes { transform-box: fill-box; transform-origin: center; animation: blink 5.2s steps(1, end) infinite; }
    .glow { animation: glow 2.4s steps(2, end) infinite; }
    .scan { animation: scan 3.64s linear infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes blink { 0%, 44%, 52%, 100% { transform: scaleY(1); } 48% { transform: scaleY(0.12); } }
    @keyframes glow { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.88; } }
    @keyframes scan { 0% { transform: translateY(-4px); opacity: 0.15; } 50% { opacity: 0.5; } 100% { transform: translateY(7px); opacity: 0.15; } }
    @media (prefers-reduced-motion: reduce) { .idle, .eyes, .glow, .scan { animation: none; } }
  ]]></style>
  <rect width="128" height="128" fill="none"/>
  <g class="idle" stroke="#260704" stroke-width="0" stroke-linejoin="miter">
    <rect x="32" y="98" width="64" height="6" fill="#000000" opacity="0.22"/>
    <polygon points="64,54 54,78 66,74" fill="#ffd05a" class="glow"/>
    <polygon points="72,62 66,82 82,78" fill="#ff7134" class="glow"/>
    <polygon points="54,66 44,84 60,78" fill="#fff0bd" opacity="0.85"/>
    <rect x="50" y="88" width="8" height="8" fill="#7b1d12"/>
    <rect x="70" y="88" width="8" height="8" fill="#7b1d12"/>
    <polygon points="54,66 74,66 82,74 82,84 74,92 54,92 46,84 46,74" fill="#7b1d12"/>
    <polygon points="56,70 72,70 78,76 78,82 72,88 56,88 50,82 50,76" fill="#ff7134"/>
    <rect x="54" y="74" width="12" height="6" fill="#fff0bd" opacity="0.75"/>
    <rect x="62" y="78" width="4" height="12" fill="#ffd05a" class="glow" opacity="0.72"/>
    <g class="eyes">
    <rect x="51" y="76" width="4" height="6" fill="#260704"/>
    <rect x="73" y="76" width="4" height="6" fill="#260704"/>
    </g>
  </g>
</svg>
